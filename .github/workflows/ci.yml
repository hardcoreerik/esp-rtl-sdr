# TheOrc-style: automated checks on every push / PR.
# Host policy tests require only CMake + a C++17 compiler (no ESP-IDF, no hardware).

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-policy:
    name: host policy unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure & build (Linux)
        if: runner.os == 'Linux'
        working-directory: tests/host
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build
          ctest --test-dir build --output-on-failure
          ./build/esp_rtl_sdr_host_tests

      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        working-directory: tests/host
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --config Debug
          $exe = "build/Debug/esp_rtl_sdr_host_tests.exe"
          if (-not (Test-Path $exe)) { $exe = "build/esp_rtl_sdr_host_tests.exe" }
          if (-not (Test-Path $exe)) { $exe = "build/esp_rtl_sdr_host_tests" }
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  truth-hygiene:
    name: truth / version hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hygiene script
        run: |
          chmod +x tests/scripts/check_truth_hygiene.sh
          ./tests/scripts/check_truth_hygiene.sh

  # Aggregate gate for branch protection convenience
  ci-ok:
    name: ci ok
    needs: [host-policy, truth-hygiene]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all required CI jobs passed"
